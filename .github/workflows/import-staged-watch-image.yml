name: import-staged-watch-image

on:
  push:
    branches:
      - ai/catalog-black-marble-20260910
    paths:
      - '.image-staging/**'

permissions:
  contents: write

jobs:
  import-image:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ai/catalog-black-marble-20260910

      - name: Decode staged turquoise image
        shell: bash
        run: |
          set -euo pipefail
          test -f .image-staging/bicolore-turquoise.webp.b64
          base64 --decode .image-staging/bicolore-turquoise.webp.b64 > public/images/watches/bicolore-turquoise.webp
          rm -rf .image-staging

      - name: Commit imported image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import corrected turquoise watch image [skip ci]"
          git push
