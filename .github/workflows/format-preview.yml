name: format-preview

on:
  push:
    branches:
      - ai/visual-copy-polish

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: Apply formatter locally
        run: npm run check:fix || true

      - name: Show formatter diff
        run: |
          git diff -- \
            IMAGE_NAMING.md \
            resources/data/watch-image-catalog.json \
            resources/js/components/VisualDisclosure.vue \
            resources/js/components/VvsNavigation.vue \
            resources/js/pages/Guides/SeoIntent.vue \
            resources/js/pages/Watches/Show.vue
