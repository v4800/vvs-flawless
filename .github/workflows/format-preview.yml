name: format-preview

on:
  push:
    branches:
      - ai/visual-copy-polish

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ai/visual-copy-polish

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: Apply formatter
        run: npm run check:fix

      - name: Commit formatter changes
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IMAGE_NAMING.md resources/data/watch-image-catalog.json resources/js/components/VisualDisclosure.vue resources/js/components/VvsNavigation.vue resources/js/pages/Guides/SeoIntent.vue resources/js/pages/Watches/Show.vue
          git commit -m "Format storefront files"
          git push origin HEAD:ai/visual-copy-polish
