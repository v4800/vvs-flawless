name: localization-verification

on:
  push:
    branches:
      - ci/vvs-localization-verify-20260917

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install frontend dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Type check
        run: npm run types:check

      - name: Check translation diff whitespace
        run: git diff --check 3a6568f8d81e19c657ab641899c114fe9ebf212b HEAD --

      - name: Run localization and SEO tests
        run: php artisan test tests/Feature/WatchLocalizationTest.php tests/Feature/SeoTest.php tests/Feature/ProductPageRegressionTest.php

      - name: Run full Laravel test suite
        run: php artisan test
