name: finalize-sourced-watch-assets

on:
  push:
    branches:
      - ai/visual-copy-polish

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ai/visual-copy-polish

      - name: Update generic unbranded model titles
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'lang/fr_BE/site.php': {
                  "'source_black_title' => 'Montre acier, cadran noir — style iced-out',": "'source_black_title' => 'Montre carrée à chiffres romains — style iced-out',",
                  "'source_red_title' => 'Montre acier, cadran rouge romain — style iced-out',": "'source_red_title' => 'Montre sportive à bracelet intégré — style bustdown',",
                  "'source_jubilee_title' => 'Montre acier, bracelet Jubilee — style bustdown',": "'source_jubilee_title' => 'Montre classique à bracelet Jubilee — style iced-out',",
              },
              'lang/en_BE/site.php': {
                  "'source_black_title' => 'Stainless steel black dial — iced-out style',": "'source_black_title' => 'Square Roman numeral watch — iced-out style',",
                  "'source_red_title' => 'Stainless steel red Roman dial — iced-out style',": "'source_red_title' => 'Integrated-bracelet sports watch — bustdown style',",
                  "'source_jubilee_title' => 'Stainless steel Jubilee bracelet — bustdown style',": "'source_jubilee_title' => 'Classic Jubilee bracelet watch — iced-out style',",
              },
              'lang/nl_BE/site.php': {
                  "'source_black_title' => 'Stalen horloge, zwarte wijzerplaat — iced-out stijl',": "'source_black_title' => 'Vierkant horloge met Romeinse cijfers — iced-out stijl',",
                  "'source_red_title' => 'Stalen horloge, rode Romeinse wijzerplaat — iced-out stijl',": "'source_red_title' => 'Sporthorloge met geïntegreerde band — bustdown stijl',",
                  "'source_jubilee_title' => 'Stalen horloge, Jubilee-band — bustdown stijl',": "'source_jubilee_title' => 'Klassiek horloge met Jubilee-band — iced-out stijl',",
              },
          }

          for filename, mapping in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in mapping.items():
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {filename}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/rebuild-sourced-watch-assets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lang/fr_BE/site.php lang/en_BE/site.php lang/nl_BE/site.php .github/workflows/rebuild-sourced-watch-assets.yml
          git commit -m 'Finalize unbranded sourced watch presentation'
          git push origin HEAD:ai/visual-copy-polish
