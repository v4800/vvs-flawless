name: format-diagnostic

on:
  push:
    branches:
      - ai/catalog-black-marble-20260910

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check:fix -- resources/js/components/CollectionHero.vue resources/js/components/CollectionValueSections.vue
      - name: Print formatted collection files
        run: |
          echo '===COLLECTION_HERO_BEGIN==='
          cat resources/js/components/CollectionHero.vue
          echo '===COLLECTION_HERO_END==='
          echo '===COLLECTION_VALUE_SECTIONS_BEGIN==='
          cat resources/js/components/CollectionValueSections.vue
          echo '===COLLECTION_VALUE_SECTIONS_END==='
