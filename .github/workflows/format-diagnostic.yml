name: format-diagnostic

on:
  push:
    branches:
      - ai/catalog-black-marble-20260910

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify 3D references
        run: |
          echo '===3D_REFERENCES_BEGIN==='
          grep -R -n -E 'HeroLiveWatch|vvs-watch\.glb|@google/model-viewer' app bootstrap config database resources routes tests package.json vite.config.* 2>/dev/null || true
          echo '===3D_REFERENCES_END==='
          echo '===3D_ASSET_SIZE==='
          stat -c '%n %s bytes' public/models/vvs-watch.glb 2>/dev/null || true
